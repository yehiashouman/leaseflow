{{- range $name, $component := dict "api" .Values.api "web" .Values.web }}
{{- if $component.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: {{ $.Release.Name }}-{{ $name }}}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ $.Release.Name }}-{{ $name }}}
  minReplicas: {{ $component.autoscaling.minReplicas }}
  maxReplicas: {{ $component.autoscaling.maxReplicas }}
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ $component.autoscaling.targetCPUUtilizationPercentage }}}}}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: {{ $.Release.Name }}-{{ $name }}}
spec: {minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}, selector: {matchLabels: {app: {{ $.Release.Name }}-{{ $name }}}}}
---
{{- end }}
{{- end }}
