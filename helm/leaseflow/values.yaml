global:
  imagePullSecrets: []
  environment: production
api:
  replicaCount: 3
  image: {repository: ghcr.io/OWNER/leaseflow-api, tag: latest, pullPolicy: IfNotPresent}
  service: {port: 3000}
  resources: {requests: {cpu: 150m, memory: 256Mi}, limits: {cpu: 1000m, memory: 1Gi}}
  autoscaling: {enabled: true, minReplicas: 3, maxReplicas: 12, targetCPUUtilizationPercentage: 70}
  env: {CORS_ORIGINS: "https://leaseflow.example.com", LOG_LEVEL: info}
web:
  replicaCount: 3
  image: {repository: ghcr.io/OWNER/leaseflow-web, tag: latest, pullPolicy: IfNotPresent}
  service: {port: 8080}
  resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
  autoscaling: {enabled: true, minReplicas: 3, maxReplicas: 8, targetCPUUtilizationPercentage: 70}
ingress:
  enabled: true
  className: alb
  host: leaseflow.example.com
  certificateArn: ""
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
secrets:
  externalSecretName: leaseflow-production
podDisruptionBudget: {minAvailable: 2}
