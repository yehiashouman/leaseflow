version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    groups: {npm: {patterns: ["*"]}}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /api
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /web
    schedule: {interval: weekly}
