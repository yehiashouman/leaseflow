name: CI
on:
  pull_request:
  push: {branches: [main]}
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_DATABASE: leaseflow_test, MYSQL_USER: leaseflow, MYSQL_PASSWORD: leaseflow, MYSQL_ROOT_PASSWORD: root}
        ports: [3306:3306]
        options: --health-cmd="mysqladmin ping -h localhost -proot" --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:8.2.1-alpine
        ports: [6379:6379]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      DATABASE_URL: mysql://leaseflow:leaseflow@127.0.0.1:3306/leaseflow_test
      REDIS_URL: redis://localhost:6379
      BUSINESS_REDIS_TESTS: 'true'
      JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run prisma:generate -w api
      - run: npm run lint
      - run: npm test
      - run: npm run test:ops
      - run: npm run prisma:migrate -w api
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run test:integration -w api
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:live -w web
      - name: Retain application browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-browser-verification
          path: web/test-results/live
          retention-days: 7
      - run: npm audit --audit-level=high
      - run: npx prisma validate --schema api/prisma/schema.prisma
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          cp api/.env.example api/.env
          docker compose config -q
  containers:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/leaseflow-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/leaseflow-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          sbom: true
  compose:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: leaseflow-ci-${{ github.run_id }}
      WEB_PORT: 8082
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - uses: docker/setup-buildx-action@v3
      - run: node scripts/compose-verify.mjs

  private-files:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_DATABASE: leaseflow_test, MYSQL_USER: leaseflow, MYSQL_PASSWORD: leaseflow, MYSQL_ROOT_PASSWORD: root}
        ports: [3306:3306]
        options: --health-cmd="mysqladmin ping -h localhost -proot" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      COMPOSE_PROJECT_NAME: leaseflow-files-${{ github.run_id }}
      DATABASE_URL: mysql://leaseflow:leaseflow@127.0.0.1:3306/leaseflow_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci-files-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-files-refresh-secret-at-least-32-characters
      FILE_SERVICE_TESTS: 'true'
      FILES_ENABLED: 'true'
      S3_PROVIDER: minio
      S3_ENDPOINT: http://127.0.0.1:19000
      S3_REGION: us-east-1
      S3_BUCKET: leaseflow-private
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minio-local-secret
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: '13310'
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - uses: docker/setup-buildx-action@v3
      - run: npm ci
      - run: npm run prisma:generate -w api
      - run: npm run prisma:migrate -w api
      - run: cp api/.env.example api/.env
      - run: docker compose -f docker-compose.yml -f infrastructure/files-test.compose.yml --profile private-files up -d --build --wait --wait-timeout 600 minio clamav
      - run: curl --fail http://127.0.0.1:19000/minio/health/live
      - run: npm run test:files -w api
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:files -w web
      - name: Retain private document browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: private-document-browser, path: web/test-results/files, retention-days: 7}
      - if: always()
        run: docker compose -f docker-compose.yml -f infrastructure/files-test.compose.yml --profile private-files down -v
