name: GitHub Pages Preview

on:
  push:
    branches: [main]
    paths: ['web/**', 'package*.json', '.github/workflows/preview.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test -w web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w web
      - run: npm run test:e2e:preview -w web
      - name: Retain browser verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-verification
          path: web/test-results
          retention-days: 7
      - run: npm run build:preview -w web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist-preview
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v5
