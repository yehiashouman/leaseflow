name: Deploy EKS
on: {workflow_dispatch: {inputs: {environment: {description: Environment, required: true, default: production, type: choice, options: [staging, production]}}}}
permissions: {contents: read, id-token: write, packages: read}
concurrency: {group: "deploy-${{ inputs.environment }}", cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: {role-to-assume: "${{ secrets.AWS_DEPLOY_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION }}"}
      - run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"
      - uses: azure/setup-helm@v4
      - run: |
          helm upgrade --install leaseflow ./helm/leaseflow \
            --namespace leaseflow --create-namespace --atomic --timeout 10m \
            --set api.image.repository=ghcr.io/${{ github.repository_owner }}/leaseflow-api \
            --set web.image.repository=ghcr.io/${{ github.repository_owner }}/leaseflow-web \
            --set api.image.tag=${{ github.sha }} --set web.image.tag=${{ github.sha }} \
            --set ingress.host=${{ vars.APP_HOST }} \
            --set ingress.certificateArn=${{ secrets.ACM_CERTIFICATE_ARN }}
